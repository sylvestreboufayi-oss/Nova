<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060f">
<title>NOVA // Recherche + Gemini</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#05060f}
body{color:#d8f6ff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden;
background-image:-webkit-linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),-webkit-linear-gradient(0deg,rgba(0,229,255,.06) 1px,transparent 1px),-webkit-radial-gradient(50% 0%,circle,#16124a 0%,#05060f 70%);
background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px),radial-gradient(circle at 50% 0%,#16124a 0%,#05060f 70%);
background-size:32px 32px,32px 32px,100% 100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(0,229,255,.25)}
.brand{font-size:14px;letter-spacing:6px;color:#00e5ff;text-shadow:0 0 10px #00e5ff;font-weight:700}
.tabs{display:-webkit-flex;display:flex}
.tab,.gear{background:transparent;color:#8fb8c6;border:1px solid rgba(0,229,255,.3);padding:8px 12px;font-size:12px;letter-spacing:2px;-webkit-appearance:none;border-radius:0}
.tab{margin-right:6px}
.tab.on{color:#05060f;background:#00e5ff;box-shadow:0 0 14px rgba(0,229,255,.7);border-color:#00e5ff}
.gear{padding:8px 10px}
.view{display:none;-webkit-flex:1;flex:1;min-height:0}
.view.on{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#vs{-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:0 18px 8vh}
.logo{font-size:54px;font-weight:800;letter-spacing:8px;margin:0 0 30px;color:#00e5ff;
background:-webkit-linear-gradient(left,#00e5ff,#8a5cff,#ff2bd6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(138,92,255,.7))}
.sub{font-size:11px;letter-spacing:5px;color:#6f93a1;margin:-22px 0 28px}
.sbox{width:100%;max-width:520px}
.in{width:100%;height:50px;background:rgba(10,14,40,.8);border:1px solid #00e5ff;color:#e8fbff;font-size:16px;padding:0 18px;border-radius:26px;outline:none;-webkit-appearance:none;box-shadow:0 0 16px rgba(0,229,255,.35),inset 0 0 12px rgba(0,229,255,.12)}
.in::-webkit-input-placeholder{color:#5f8896}
.row{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;margin-top:22px;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.btn{background:rgba(138,92,255,.15);color:#e8fbff;border:1px solid #8a5cff;padding:12px 16px;margin:0 5px 10px;font-size:12px;letter-spacing:2px;border-radius:22px;-webkit-appearance:none;box-shadow:0 0 12px rgba(138,92,255,.4)}
.btn.c{border-color:#00e5ff;background:rgba(0,229,255,.12);box-shadow:0 0 12px rgba(0,229,255,.4)}
#log{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.msg{max-width:88%;margin:0 0 12px;padding:11px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;border-radius:14px}
.user{margin-left:auto;background:rgba(0,229,255,.14);border:1px solid #00e5ff;box-shadow:0 0 12px rgba(0,229,255,.25)}
.bot{background:rgba(138,92,255,.14);border:1px solid #8a5cff;box-shadow:0 0 12px rgba(138,92,255,.25)}
.sys{max-width:100%;color:#ff8ad8;border:1px dashed #ff2bd6;font-size:13px}
.bar{display:-webkit-flex;display:flex;padding:10px 12px;border-top:1px solid rgba(0,229,255,.25);background:rgba(5,6,15,.85)}
.bar .in{-webkit-flex:1;flex:1;height:46px}
.bar .btn{margin:0 0 0 8px;padding:0 16px;height:46px}
.hint{font-size:11px;color:#5f8896;text-align:center;padding:0 14px 8px;letter-spacing:1px}
#set{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(2,3,10,.92);z-index:10;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 18px 24px}
#set.on{display:block}
.card{max-width:480px;margin:0 auto;border:1px solid #00e5ff;border-radius:14px;padding:18px;background:#080b24;box-shadow:0 0 22px rgba(0,229,255,.3)}
.card h2{margin:0 0 14px;font-size:14px;letter-spacing:4px;color:#00e5ff}
.card label{display:block;font-size:11px;letter-spacing:2px;color:#8fb8c6;margin:14px 0 6px}
.card .in{border-radius:10px;height:44px}
.card p{font-size:12px;color:#8fb8c6;line-height:1.5}
.card a{color:#00e5ff}
</style>
</head>
<body>
<div class="top">
<div class="brand">NOVA</div>
<div class="tabs">
<button class="tab on" id="t1" type="button">RECHERCHE</button>
<button class="tab" id="t2" type="button">GEMINI</button>
</div>
<button class="gear" id="gear" type="button">⚙</button>
</div>

<div class="view on" id="vs">
<h1 class="logo">NOVA</h1>
<div class="sub">RECHERCHE GOOGLE</div>
<form class="sbox" action="https://www.google.com/search" method="get">
<input class="in" type="search" name="q" id="q" placeholder="Rechercher sur le web…" autocomplete="off" autocapitalize="off" autocorrect="off">
<div class="row">
<button class="btn c" type="submit">RECHERCHER</button>
<button class="btn" type="button" id="ask">DEMANDER À GEMINI</button>
</div>
</form>
</div>

<div class="view" id="vg">
<div id="log"></div>
<div class="hint">Gemini peut se tromper. Vérifie les infos importantes.</div>
<form class="bar" id="cf" action="#">
<input class="in" type="text" id="p" placeholder="Écris à Gemini…" autocomplete="off">
<button class="btn c" type="submit" id="send">OK</button>
</form>
</div>

<div id="set">
<div class="card">
<h2>RÉGLAGES GEMINI</h2>
<p>Crée une clé gratuite sur <a href="https://aistudio.google.com/apikey">Google AI Studio</a>, puis colle-la ici. Elle reste enregistrée seulement sur cet appareil.</p>
<label for="k">CLÉ API</label>
<input class="in" type="password" id="k" autocomplete="off" autocapitalize="off" autocorrect="off">
<label for="m">MODÈLE</label>
<input class="in" type="text" id="m" autocomplete="off" autocapitalize="off" autocorrect="off">
<div class="row">
<button class="btn c" type="button" id="save">ENREGISTRER</button>
<button class="btn" type="button" id="reset">NOUVELLE DISCUSSION</button>
</div>
</div>
</div>

<script>
(function(){
  function $(id){return document.getElementById(id);}
  function trim(s){return s.replace(/^\s+|\s+$/g,'');}
  var store={
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},
    set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  };
  var DEFAULT_MODEL='gemini-2.5-flash';
  var history=[];
  var busy=false;

  function show(which){
    $('vs').className='view'+(which==='s'?' on':'');
    $('vg').className='view'+(which==='g'?' on':'');
    $('t1').className='tab'+(which==='s'?' on':'');
    $('t2').className='tab'+(which==='g'?' on':'');
    if(which==='g'){var l=$('log');l.scrollTop=l.scrollHeight;}
  }
  function addMsg(role,text){
    var d=document.createElement('div');
    d.className='msg '+role;
    d.textContent=text;
    $('log').appendChild(d);
    $('log').scrollTop=$('log').scrollHeight;
    return d;
  }
  function openSet(){
    $('k').value=store.get('gkey','');
    $('m').value=store.get('gmodel',DEFAULT_MODEL);
    $('set').className='on';
  }
  function ask(text){
    var key=store.get('gkey','');
    if(!key){openSet();return;}
    if(busy){return;}
    busy=true;
    addMsg('user',text);
    history.push({role:'user',parts:[{text:text}]});
    var wait=addMsg('bot','…');
    var model=store.get('gmodel',DEFAULT_MODEL);
    var url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key);
    var body={
      system_instruction:{parts:[{text:'Tu es un assistant utile. Réponds en français, de façon claire et concise.'}]},
      contents:history
    };
    function fail(msg){
      history.pop();
      wait.className='msg sys';
      wait.textContent=msg;
      busy=false;
    }
    var x=new XMLHttpRequest();
    x.open('POST',url,true);
    x.setRequestHeader('Content-Type','application/json');
    x.timeout=60000;
    x.onload=function(){
      var data=null;
      try{data=JSON.parse(x.responseText);}catch(e){}
      if(x.status!==200){
        var m=(data&&data.error&&data.error.message)?data.error.message:('Erreur '+x.status);
        fail('Erreur : '+m);
        return;
      }
      var out='';
      try{
        var parts=data.candidates[0].content.parts;
        for(var i=0;i<parts.length;i++){if(parts[i].text){out+=parts[i].text;}}
      }catch(e){}
      if(!out){fail('Gemini n’a renvoyé aucune réponse (contenu peut-être bloqué).');return;}
      history.push({role:'model',parts:[{text:out}]});
      wait.textContent=out;
      $('log').scrollTop=$('log').scrollHeight;
      busy=false;
    };
    x.onerror=function(){fail('Connexion impossible. Vérifie ta connexion internet.');};
    x.ontimeout=function(){fail('Délai dépassé. Réessaie.');};
    x.send(JSON.stringify(body));
  }

  $('t1').onclick=function(){show('s');};
  $('t2').onclick=function(){show('g');};
  $('gear').onclick=openSet;
  $('ask').onclick=function(){
    var v=trim($('q').value);
    show('g');
    if(v){ask(v);}else{$('p').focus();}
  };
  $('cf').onsubmit=function(){
    var v=trim($('p').value);
    if(v){$('p').value='';ask(v);}
    return false;
  };
  $('save').onclick=function(){
    store.set('gkey',trim($('k').value));
    var m=trim($('m').value);
    store.set('gmodel',m||DEFAULT_MODEL);
    $('set').className='';
  };
  $('reset').onclick=function(){
    history=[];
    $('log').innerHTML='';
    addMsg('sys','Nouvelle discussion démarrée.');
    $('set').className='';
    show('g');
  };
  addMsg('sys','Bienvenue. Ajoute ta clé API Gemini avec le bouton ⚙ pour commencer.');
})();
</script>
</body>
</html>
