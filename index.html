<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Grok</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#000;color:#ececec;font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font-family:inherit;-webkit-appearance:none;cursor:pointer}
svg{display:block}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;background:#000}

/* barre du haut */
#bar{padding:8px 10px;padding-top:calc(8px + constant(safe-area-inset-top));padding-top:calc(8px + env(safe-area-inset-top));display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.ib{width:42px;height:42px;border-radius:21px;border:0;background:transparent;color:#ececec;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:0}
.ib:active{background:#1c1c1c}
#mp{border:0;background:transparent;color:#ececec;font-size:19px;font-weight:600;letter-spacing:-.3px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:8px 10px;border-radius:20px}
#mp svg{margin-left:4px;color:#8c8c8c}

/* messages */
#msgs{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 14px}
#msgs.empty{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center;padding-bottom:40px}
.wm{font-size:58px;font-weight:700;letter-spacing:-2px;color:#fff;margin:0;line-height:1}
.hint{color:#8c8c8c;font-size:14px;margin-top:14px;text-align:center;line-height:1.5}
.chips{margin-top:26px;text-align:center;max-width:420px}
.chip{display:inline-block;background:#141414;border:1px solid #262626;color:#cfcfcf;border-radius:18px;padding:9px 14px;font-size:14px;margin:0 4px 8px}
.chip:active{background:#1f1f1f}
.mu{display:-webkit-flex;display:flex;-webkit-justify-content:flex-end;justify-content:flex-end;margin:14px 0 6px}
.mu div{max-width:84%;background:#262626;color:#fff;padding:10px 16px;border-radius:22px;line-height:1.45;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.ma{margin:8px 0 18px;line-height:1.6;font-size:16px;word-wrap:break-word}
.ab{white-space:pre-wrap}
.ab pre{background:#111;border:1px solid #262626;border-radius:12px;padding:12px;overflow-x:auto;margin:10px 0;white-space:pre;-webkit-overflow-scrolling:touch}
.ab pre,.ab code{font-family:Menlo,Courier,monospace;font-size:13px}
.ab code.i{background:#1e1e1e;padding:2px 5px;border-radius:5px}
.ab b.h{display:block;font-size:17px;margin:10px 0 2px}
.ac{margin-top:6px;margin-left:-8px}
.ac button{border:0;background:transparent;color:#8c8c8c;width:36px;height:34px;border-radius:17px;padding:0;display:inline-block;vertical-align:top}
.ac button svg{margin:8px auto}
.ac button:active,.ac button.ok{color:#fff}
.err .ab{color:#ff8a8a}
.dots span{display:inline-block;width:7px;height:7px;margin:0 3px 0 0;background:#8c8c8c;border-radius:4px;-webkit-animation:b 1.1s infinite;animation:b 1.1s infinite}
.dots span:nth-child(2){-webkit-animation-delay:.18s;animation-delay:.18s}
.dots span:nth-child(3){-webkit-animation-delay:.36s;animation-delay:.36s}
@-webkit-keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* outils vocaux et création */
#tools{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
#tools button{border:1px solid #333;background:#191919;color:#ddd;border-radius:18px;padding:8px 12px;font-size:13px}
#tools button:active,#tools button.active{background:#fff;color:#000}
#tools button:disabled{opacity:.45}
.media-result{margin:12px 0;padding:10px;background:#141414;border:1px solid #292929;border-radius:14px}
.media-result img,.media-result video{display:block;width:100%;height:auto;border-radius:10px}
.media-result a{color:#aaa;font-size:13px;display:block;margin-top:8px;word-break:break-all}
.media-status{color:#aaa;font-size:13px;margin:10px 0}
.voice-on{color:#ff7777!important}

/* zone de saisie */
#in{padding:6px 12px;padding-bottom:calc(10px + constant(safe-area-inset-bottom));padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#000}
#box{background:#141414;border:1px solid #2a2a2a;border-radius:26px;padding:10px 10px 8px 16px}
#t{display:block;width:100%;background:transparent;color:#fff;border:0;font-size:16px;font-family:inherit;resize:none;max-height:130px;outline:none;padding:4px 0 6px;-webkit-appearance:none;line-height:1.4}
#t::-webkit-input-placeholder{color:#7d7d7d}
#row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-top:2px}
#th{border:1px solid #333;background:transparent;color:#cfcfcf;border-radius:18px;padding:7px 14px;font-size:14px;font-weight:500}
#th.on{background:#fff;color:#000;border-color:#fff}
#s{width:38px;height:38px;border-radius:19px;border:0;background:#2e2e2e;color:#7a7a7a;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:0}
#s.go{background:#fff;color:#000}
.disc{text-align:center;color:#666;font-size:11px;margin-top:8px}

/* panneau latéral */
#dr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:8}
#dro{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6)}
#drp{position:absolute;top:0;left:0;bottom:0;width:84%;max-width:340px;background:#0b0b0b;border-right:1px solid #1f1f1f;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#dh{padding:12px;padding-top:calc(12px + constant(safe-area-inset-top));padding-top:calc(12px + env(safe-area-inset-top))}
#sw{position:relative}
#sw svg{position:absolute;left:12px;top:11px;color:#7d7d7d}
#q{width:100%;background:#171717;color:#fff;border:0;border-radius:20px;padding:10px 14px 10px 38px;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none}
#dnew{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;background:transparent;border:0;color:#fff;font-size:16px;padding:12px 8px;margin-top:6px;text-align:left;border-radius:12px}
#dnew svg{margin-right:12px}
#dnew:active{background:#171717}
#dl{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 14px}
.g{color:#7d7d7d;font-size:12px;margin:16px 10px 6px}
.c{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;border-radius:12px}
.c.on{background:#1a1a1a}
.c .tt{-webkit-flex:1;flex:1;min-width:0;padding:11px 10px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e6e6e6}
.c .x{background:none;border:0;color:#6f6f6f;font-size:15px;padding:10px 12px}
.empty2{color:#6a6a6a;font-size:14px;text-align:center;margin:30px 14px;line-height:1.5}
#df{padding:8px 12px;padding-bottom:calc(8px + constant(safe-area-inset-bottom));padding-bottom:calc(8px + env(safe-area-inset-bottom));border-top:1px solid #1f1f1f;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
#df button{background:none;border:0;color:#bdbdbd;font-size:14px;padding:10px 8px}
#dall{color:#ff8a8a!important}

/* réglages */
#cfg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:9;padding:20px;overflow-y:auto}
#cfg .bx{background:#111;border:1px solid #2a2a2a;border-radius:20px;padding:18px;max-width:480px;margin:30px auto}
#cfg h2{margin:0 0 6px;font-size:19px}
#cfg label{display:block;font-size:13px;color:#999;margin:14px 0 5px}
#cfg input,#cfg textarea{width:100%;background:#000;color:#fff;border:1px solid #2a2a2a;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;-webkit-appearance:none;outline:none}
#cfg textarea{height:100px}
#cfg .r{margin-top:18px;text-align:right}
.pb{border:1px solid #333;background:transparent;color:#ddd;border-radius:18px;padding:9px 16px;font-size:15px;margin-left:8px}
.pb.w{background:#fff;color:#000;border-color:#fff}

/* Compatibilité iPhone 6 / Safari iOS ancien */
html{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100%;overflow:hidden}
#app{height:100vh;height:-webkit-fill-available;min-height:0}
#bar,#in,#drp,#cfg .bx{-webkit-flex-shrink:0;flex-shrink:0}
#msgs{-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
#tools{display:block;margin-top:8px}
#tools button{display:inline-block;margin:0 5px 6px 0;min-height:36px;touch-action:manipulation}
button,input,textarea{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
#t{min-height:28px;max-width:100%;-webkit-user-select:text;user-select:text}
#cfg{-webkit-overflow-scrolling:touch}
#cfg .bx{width:100%;margin:12px auto;padding:16px}
#cfg input,#cfg textarea,#q{font-size:16px}
#drp{height:100%;height:100vh;height:-webkit-fill-available}
#dl{min-height:0}
.media-result img,.media-result video{max-width:100%;height:auto}
.ab,.mu div,.media-status{overflow-wrap:break-word;word-wrap:break-word}
@media screen and (max-width: 375px){
  #bar{padding-left:6px;padding-right:6px}
  #msgs{padding-left:12px;padding-right:12px}
  #in{padding-left:8px;padding-right:8px}
  #box{padding:9px 9px 8px 12px;border-radius:22px}
  #th{padding:7px 11px;font-size:13px}
  #tools button{padding:8px 10px;font-size:12px}
  .wm{font-size:50px}
  .mu div{max-width:92%}
  #cfg{padding:10px}
  #cfg .bx{margin:8px auto;padding:14px}
  .pb{padding:9px 12px;margin-left:4px}
}
@media screen and (max-height: 600px){
  #bar{padding-top:4px;padding-bottom:4px}
  .ib{height:36px;width:36px}
  #msgs.empty{padding-bottom:12px}
  .chips{margin-top:12px}
  #in{padding-top:4px;padding-bottom:6px}
  .disc{margin-top:4px}
}

</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="ib" id="bh"></button>
    <button id="mp"><span>Grok</span></button>
    <button class="ib" id="bn"></button>
  </div>
  <div id="msgs"></div>
  <div id="in">
    <div id="box">
      <textarea id="t" rows="1" placeholder="Que veux-tu savoir ?"></textarea>
      <div id="row">
        <button id="th">Réflexion</button>
        <button id="s"></button>
      </div>
      <div id="tools">
        <button id="mic" type="button">🎙️ Parler</button>
        <button id="imggen" type="button">🎨 Image</button>
        <button id="vidgen" type="button">🎬 Vidéo</button>
      </div>
    </div>
    <div class="disc">Les réponses peuvent contenir des erreurs.</div>
  </div>
</div>

<div id="dr">
  <div id="dro"></div>
  <div id="drp">
    <div id="dh">
      <div id="sw"><span id="ics"></span><input id="q" type="search" placeholder="Rechercher" autocomplete="off" autocapitalize="off" autocorrect="off"></div>
      <button id="dnew"><span id="icn"></span>Nouvelle conversation</button>
    </div>
    <div id="dl"></div>
    <div id="df"><button id="dset">&#9881; Réglages</button><button id="dall">Tout effacer</button></div>
  </div>
</div>

<div id="cfg">
  <div class="bx">
    <h2>Réglages</h2>
    <label>Clé API xAI (console.x.ai)</label>
    <input id="k" type="password" placeholder="xai-..." autocomplete="off" autocapitalize="off" autocorrect="off">
    <label>Modèle</label>
    <input id="md" type="text" placeholder="grok-4" autocapitalize="off" autocorrect="off">
    <label>Personnalité (instructions système)</label>
    <textarea id="sp"></textarea>
    <div class="r">
      <button class="pb" id="cx">Fermer</button>
      <button class="pb w" id="cs">Enregistrer</button>
    </div>
  </div>
</div>

<script>
(function(){
  var DEF_SYS = "Tu es Grok, une IA curieuse, directe et un peu espiègle, avec une pointe d'humour. Tu réponds en français sauf si on te parle dans une autre langue. Sois clair, concis et honnête.";
  var THINK = " Prends le temps de raisonner étape par étape avant de répondre.";
  var DEF_MODEL = "grok-4";
  var URL = "https://api.x.ai/v1/chat/completions";
  var $ = function(i){return document.getElementById(i);};
  var msgs = $("msgs"), t = $("t"), s = $("s");
  var history = [], curId = null, busy = false, curXhr = null;

  /* ---------- icônes ---------- */
  function ico(p, w){ w = w || 22; return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
  var I = {
    menu: ico('<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="13" y2="15"/>'),
    edit: ico('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
    chev: ico('<path d="M6 9l6 6 6-6"/>', 16),
    copy: ico('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', 18),
    regen: ico('<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>', 18),
    up: ico('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>', 20),
    stop: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
    search: ico('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>', 17)
  };
  $("bh").innerHTML = I.menu; $("bn").innerHTML = I.edit; $("icn").innerHTML = I.edit;
  $("ics").innerHTML = I.search; $("mp").innerHTML = "<span>Grok</span>" + I.chev;
  s.innerHTML = I.up;

  function store(k, v){ try{ if(v===undefined){ return localStorage.getItem(k);} localStorage.setItem(k, v);}catch(e){ return null; } }
  function cfgKey(){ return store("grok_key") || ""; }
  function cfgModel(){ return store("grok_model") || DEF_MODEL; }
  function cfgSys(){ return store("grok_sys") || DEF_SYS; }
  function thinkOn(){ return store("grok_think") === "1"; }

  /* ---------- conversations ---------- */
  function loadConvs(){
    var r = store("grok_convs"); if(!r) return [];
    try{ var a = JSON.parse(r); return (a instanceof Array) ? a : []; }catch(e){ return []; }
  }
  function saveConvs(a){ store("grok_convs", JSON.stringify(a)); }
  function findIdx(a, id){ for(var i=0;i<a.length;i++){ if(a[i].id===id) return i; } return -1; }
  function persist(){
    if(!history.length) return;
    var a = loadConvs();
    if(!curId) curId = "c" + new Date().getTime();
    var i = findIdx(a, curId);
    var title = history[0].content.replace(/\s+/g," ");
    if(title.length > 45) title = title.substring(0,45) + "…";
    var c = {id:curId, title:title, ts:new Date().getTime(), msgs:history.slice(0)};
    if(i >= 0){ c.title = a[i].title; a.splice(i,1); }
    a.unshift(c); saveConvs(a);
  }
  function groupOf(ts){
    var d = new Date(); d.setHours(0,0,0,0); var today = d.getTime(), day = 86400000;
    if(ts >= today) return "Aujourd'hui";
    if(ts >= today - day) return "Hier";
    if(ts >= today - 7*day) return "7 derniers jours";
    return "Plus ancien";
  }
  function renderList(){
    var a = loadConvs(), box = $("dl"), f = $("q").value.toLowerCase();
    box.innerHTML = "";
    var shown = 0, last = "";
    for(var i=0;i<a.length;i++){
      if(f && a[i].title.toLowerCase().indexOf(f) < 0) continue;
      shown++;
      (function(c){
        var g = groupOf(c.ts);
        if(g !== last){ var h = document.createElement("div"); h.className = "g"; h.textContent = g; box.appendChild(h); last = g; }
        var row = document.createElement("div"); row.className = "c" + (c.id===curId ? " on" : "");
        var tt = document.createElement("div"); tt.className = "tt"; tt.textContent = c.title;
        tt.onclick = function(){ openConv(c.id); };
        var x = document.createElement("button"); x.className = "x"; x.innerHTML = "&#10005;";
        x.onclick = function(){ delConv(c.id); };
        row.appendChild(tt); row.appendChild(x); box.appendChild(row);
      })(a[i]);
    }
    if(!shown){
      var e = document.createElement("div"); e.className = "empty2";
      e.innerHTML = a.length ? "Aucun résultat." : "Aucune conversation pour l'instant.";
      box.appendChild(e);
    }
  }
  function openConv(id){
    if(busy) return;
    var a = loadConvs(), i = findIdx(a, id); if(i < 0) return;
    curId = id; history = a[i].msgs.slice(0);
    drawAll(); closeDrawer();
  }
  function delConv(id){
    if(busy && id===curId) return;
    if(!confirm("Supprimer cette conversation ?")) return;
    var a = loadConvs(), i = findIdx(a, id);
    if(i >= 0){ a.splice(i,1); saveConvs(a); }
    if(id === curId){ newChat(); }
    renderList();
  }
  function delAll(){
    if(busy) return;
    if(!confirm("Effacer TOUTES les conversations ?")) return;
    saveConvs([]); newChat(); renderList();
  }
  function newChat(){
    if(busy) return;
    history = []; curId = null; drawAll();
  }
  function openDrawer(){ $("q").value = ""; renderList(); $("dr").style.display = "block"; }
  function closeDrawer(){ $("dr").style.display = "none"; $("q").blur(); }

  /* ---------- mise en forme ---------- */
  function esc(x){ return x.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function inl(x){
    var h = esc(x);
    h = h.replace(/^#{1,4}[ \t]+(.+)$/gm, '<b class="h">$1</b>');
    h = h.replace(/^[ \t]*[-*][ \t]+/gm, "\u2022 ");
    h = h.replace(/`([^`\n]+)`/g, '<code class="i">$1</code>');
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    return h;
  }
  function fmt(x){
    var p = x.split("```"), out = "";
    for(var i=0;i<p.length;i++){
      if(i % 2 === 1 && i < p.length - 1 || (i % 2 === 1 && i === p.length - 1 && false)){
        var c = p[i], nl = c.indexOf("\n");
        if(nl >= 0 && /^[\w+#-]*$/.test(c.substring(0,nl))) c = c.substring(nl+1);
        out += "<pre>" + esc(c.replace(/\n$/,"")) + "</pre>";
      } else {
        out += inl(i % 2 === 1 ? "```" + p[i] : p[i]).replace(/^\n+|\n+$/g, function(m){ return i===0||i===p.length-1 ? "" : m; });
      }
    }
    return out;
  }
  function scroll(){ msgs.scrollTop = msgs.scrollHeight; }

  /* ---------- affichage ---------- */
  function copyText(txt, btn){
    function ok(){ btn.className = "ok"; setTimeout(function(){ btn.className = ""; }, 1200); }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok(); return; }
    }catch(e){}
    try{
      var ta = document.createElement("textarea"); ta.value = txt;
      ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0"; ta.style.fontSize = "16px";
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, 999999);
      document.execCommand("copy"); document.body.removeChild(ta); ok();
    }catch(e2){}
  }
  function hideRegen(){
    var r = msgs.querySelectorAll(".rg");
    for(var i=0;i<r.length;i++){ r[i].style.display = "none"; }
  }
  function addUser(text){
    var w = document.createElement("div"); w.className = "mu";
    var d = document.createElement("div"); d.textContent = text; w.appendChild(d);
    msgs.appendChild(w); scroll();
  }
  function addAssistant(text, loading){
    var d = document.createElement("div"); d.className = "ma";
    var b = document.createElement("div"); b.className = "ab"; d.appendChild(b);
    msgs.appendChild(d);
    if(loading){ b.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>'; }
    else { finish(d, text); }
    scroll(); return d;
  }
  function finish(d, text){
    d.className = "ma";
    d.firstChild.innerHTML = fmt(text);
    var old = d.querySelector(".ac"); if(old) d.removeChild(old);
    var ac = document.createElement("div"); ac.className = "ac";
    var c = document.createElement("button"); c.innerHTML = I.copy;
    c.onclick = function(){ copyText(text, c); };
    var v = document.createElement("button"); v.innerHTML = "🔊";
    v.title = "Lire la réponse à voix haute";
    v.onclick = function(){ speakText(text, v); };
    var r = document.createElement("button"); r.className = "rg"; r.innerHTML = I.regen;
    r.onclick = regen;
    ac.appendChild(c); ac.appendChild(v); ac.appendChild(r); d.appendChild(ac);
    hideRegen(); r.style.display = "inline-block";
  }
  function drawAll(){
    msgs.innerHTML = "";
    if(!history.length){
      msgs.className = "empty";
      var w = document.createElement("div"); w.className = "wm"; w.textContent = "Grok"; msgs.appendChild(w);
      if(!cfgKey()){
        var h = document.createElement("div"); h.className = "hint";
        h.innerHTML = "Ouvre le menu &#9776; puis Réglages<br>pour ajouter ta clé API xAI."; msgs.appendChild(h);
      }
      var ch = document.createElement("div"); ch.className = "chips";
      var sug = ["Explique-moi un sujet simplement", "Aide-moi à écrire un message", "Une idée de recette ce soir ?", "Raconte-moi une blague"];
      for(var i=0;i<sug.length;i++){
        (function(q){
          var b = document.createElement("button"); b.className = "chip"; b.textContent = q;
          b.onclick = function(){ t.value = q; send(); };
          ch.appendChild(b);
        })(sug[i]);
      }
      msgs.appendChild(ch);
    } else {
      msgs.className = "";
      for(var j=0;j<history.length;j++){
        if(history[j].role === "user") addUser(history[j].content); else addAssistant(history[j].content);
      }
      scroll();
    }
    updSend();
  }
  function setBusy(b){ busy = b; updSend(); }
  function updSend(){
    if(busy){ s.innerHTML = I.stop; s.className = "go"; }
    else { s.innerHTML = I.up; s.className = t.value.replace(/\s/g,"") ? "go" : ""; }
  }

  /* ---------- envoi ---------- */
  function send(){
    if(busy){ if(curXhr) curXhr.abort(); return; }
    var q = t.value.replace(/^\s+|\s+$/g, "");
    if(!q) return;
    if(!cfgKey()){ openCfg(); return; }
    if(!history.length){ msgs.innerHTML = ""; msgs.className = ""; }
    addUser(q);
    history.push({role:"user", content:q});
    t.value = ""; t.style.height = "auto";
    ask(null);
  }
  function regen(){
    if(busy || !history.length) return;
    var last = history[history.length-1];
    if(last.role !== "assistant") return;
    history.pop();
    var all = msgs.querySelectorAll(".ma");
    if(all.length) msgs.removeChild(all[all.length-1]);
    ask(last.content);
  }
  function ask(restore){
    var wait = addAssistant("", true);
    setBusy(true);
    var payload = {
      model: cfgModel(),
      messages: [{role:"system", content: cfgSys() + (thinkOn() ? THINK : "")}].concat(history),
      stream: false
    };
    var x = new XMLHttpRequest(); curXhr = x;
    x.open("POST", URL, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.setRequestHeader("Authorization", "Bearer " + cfgKey());
    x.timeout = 180000;
    function undo(){
      if(restore !== null){ history.push({role:"assistant", content:restore}); }
      else { history.pop(); }
    }
    function fail(m){
      curXhr = null; undo();
      wait.className = "ma err"; wait.firstChild.textContent = m;
      setBusy(false); scroll();
    }
    x.onload = function(){
      curXhr = null;
      var r;
      try{ r = JSON.parse(x.responseText); }catch(e){ return fail("Réponse illisible (code " + x.status + ")."); }
      if(x.status >= 200 && x.status < 300 && r.choices && r.choices[0]){
        var a = r.choices[0].message.content || "";
        history.push({role:"assistant", content:a});
        finish(wait, a); persist(); setBusy(false); scroll();
      } else {
        var em = (r.error && (r.error.message || r.error)) || r.message || ("Erreur " + x.status);
        fail("Erreur : " + (typeof em === "string" ? em : JSON.stringify(em)));
      }
    };
    x.onerror = function(){ fail("Connexion impossible. Vérifie ton réseau et ta clé API."); };
    x.ontimeout = function(){ fail("Délai dépassé. Réessaie."); };
    x.onabort = function(){
      curXhr = null; undo();
      if(wait.parentNode) wait.parentNode.removeChild(wait);
      setBusy(false);
      if(!history.length) drawAll();
    };
    x.send(JSON.stringify(payload));
  }


  /* ---------- voix, images et vidéos ---------- */
  var recognition = null;
  function speakText(text, btn){
    if(!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance === "undefined"){ alert("La lecture vocale n'est pas disponible sur ce navigateur."); return; }
    window.speechSynthesis.cancel();
    var u = new window.SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = 1;
    if(btn){ btn.classList.add("ok"); u.onend = function(){btn.classList.remove("ok");}; }
    window.speechSynthesis.speak(u);
  }
  function toggleMic(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      alert("La reconnaissance vocale intégrée n'est pas disponible dans Safari sur iPhone 6. Appuie sur OK, puis utilise le microphone du clavier iPhone (si activé) pour dicter ton texte.");
      t.focus();
      return;
    }
    if(recognition){ recognition.stop(); recognition = null; $("mic").classList.remove("active"); return; }
    recognition = new SR(); recognition.lang = "fr-FR"; recognition.interimResults = false; recognition.continuous = false;
    recognition.onresult = function(e){
      var spoken = e.results[0][0].transcript;
      t.value = (t.value ? t.value + " " : "") + spoken;
      t.dispatchEvent(new Event("input"));
    };
    recognition.onerror = function(){ $("mic").classList.remove("active"); recognition = null; };
    recognition.onend = function(){ $("mic").classList.remove("active"); recognition = null; };
    $("mic").classList.add("active");
    try{ recognition.start(); }catch(e){ recognition = null; $("mic").classList.remove("active"); }
  }
  function mediaStatus(message){
    var d = document.createElement("div"); d.className = "media-status"; d.textContent = message;
    msgs.appendChild(d); scroll(); return d;
  }
  function showImage(url, prompt){
    var wrap = document.createElement("div"); wrap.className = "media-result";
    var im = document.createElement("img"); im.src = url; im.alt = prompt; if ("loading" in im) im.loading = "lazy";
    var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Ouvrir / enregistrer l’image";
    wrap.appendChild(im); wrap.appendChild(a); msgs.appendChild(wrap); scroll();
  }
  function showVideo(url, prompt){
    var wrap = document.createElement("div"); wrap.className = "media-result";
    var v = document.createElement("video"); v.src = url; v.controls = true; v.playsInline = true;
    var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Ouvrir / télécharger la vidéo";
    wrap.appendChild(v); wrap.appendChild(a); msgs.appendChild(wrap); scroll();
  }
  function apiError(r, status){
    return (r && r.error && (r.error.message || r.error)) || (r && r.message) || ("Erreur API " + status);
  }
  function generateImage(){
    var prompt = t.value.replace(/^\s+|\s+$/g,"");
    if(!prompt){ alert("Décris l’image que tu souhaites créer."); t.focus(); return; }
    if(!cfgKey()){ openCfg(); return; }
    t.value = ""; t.style.height = "auto"; updSend();
    addUser("🎨 Générer une image : " + prompt);
    history.push({role:"user",content:"Génère une image : " + prompt});
    var status = mediaStatus("Création de l’image en cours…");
    $("imggen").disabled = true;
    var x = new XMLHttpRequest(); x.open("POST","https://api.x.ai/v1/images/generations",true);
    x.setRequestHeader("Content-Type","application/json"); x.setRequestHeader("Authorization","Bearer "+cfgKey()); x.timeout=180000;
    x.onload=function(){
      $("imggen").disabled=false;
      var r; try{r=JSON.parse(x.responseText);}catch(e){status.textContent="Réponse API illisible.";return;}
      if(x.status>=200 && x.status<300 && r.data && r.data[0] && r.data[0].url){
        status.remove(); showImage(r.data[0].url,prompt);
        history.push({role:"assistant",content:"Image créée : "+r.data[0].url}); persist();
      } else status.textContent="Impossible de créer l’image : "+apiError(r,x.status);
    };
    x.onerror=function(){$("imggen").disabled=false;status.textContent="Connexion impossible à l’API xAI.";};
    x.ontimeout=function(){$("imggen").disabled=false;status.textContent="Délai dépassé. Réessaie.";};
    x.send(JSON.stringify({model:"grok-imagine-image-2.0",prompt:prompt,response_format:"url",n:1}));
  }
  function generateVideo(){
    var prompt = t.value.replace(/^\s+|\s+$/g,"");
    if(!prompt){ alert("Décris la vidéo que tu souhaites créer."); t.focus(); return; }
    if(!cfgKey()){ openCfg(); return; }
    t.value = ""; t.style.height = "auto"; updSend();
    addUser("🎬 Générer une vidéo : " + prompt);
    history.push({role:"user",content:"Génère une vidéo : " + prompt});
    var status = mediaStatus("Demande envoyée. Génération de la vidéo… Cela peut prendre quelques minutes.");
    $("vidgen").disabled = true;
    function finishError(msg){ $("vidgen").disabled=false; status.textContent=msg; }
    var x = new XMLHttpRequest(); x.open("POST","https://api.x.ai/v1/videos/generations",true);
    x.setRequestHeader("Content-Type","application/json"); x.setRequestHeader("Authorization","Bearer "+cfgKey()); x.timeout=180000;
    x.onload=function(){
      var r; try{r=JSON.parse(x.responseText);}catch(e){finishError("Réponse API illisible.");return;}
      if(x.status<200 || x.status>=300 || !r.request_id){finishError("Impossible de lancer la vidéo : "+apiError(r,x.status));return;}
      var id=r.request_id, tries=0;
      function poll(){
        var p=new XMLHttpRequest(); p.open("GET","https://api.x.ai/v1/videos/"+encodeURIComponent(id),true);
        p.setRequestHeader("Authorization","Bearer "+cfgKey()); p.timeout=60000;
        p.onload=function(){
          var z; try{z=JSON.parse(p.responseText);}catch(e){finishError("Réponse de suivi illisible.");return;}
          if(p.status>=200 && p.status<300 && z.status==="done" && z.video && z.video.url){
            $("vidgen").disabled=false; status.remove(); showVideo(z.video.url,prompt);
            history.push({role:"assistant",content:"Vidéo créée : "+z.video.url}); persist();
          } else if(z.status==="failed" || z.error){finishError("La génération vidéo a échoué : "+apiError(z,p.status));}
          else if(tries++<90){status.textContent="Génération en cours… ("+(tries*5)+" s)";window.setTimeout(poll,5000);}
          else finishError("La génération prend trop de temps. Réessaie plus tard.");
        };
        p.onerror=function(){if(tries++<90)window.setTimeout(poll,5000);else finishError("Connexion interrompue pendant le suivi.");};
        p.send();
      }
      poll();
    };
    x.onerror=function(){finishError("Connexion impossible à l’API xAI.");};
    x.ontimeout=function(){finishError("Délai dépassé lors du lancement.");};
    x.send(JSON.stringify({model:"grok-imagine-video-1.5",prompt:prompt,duration:6,aspect_ratio:"16:9",resolution:"720p"}));
  }

  /* ---------- réglages ---------- */
  function openCfg(){
    $("k").value = cfgKey(); $("md").value = store("grok_model") || ""; $("sp").value = store("grok_sys") || DEF_SYS;
    closeDrawer(); $("cfg").style.display = "block";
  }
  function closeCfg(){ $("cfg").style.display = "none"; }

  s.onclick = send;
  $("mic").onclick = toggleMic;
  $("imggen").onclick = generateImage;
  $("vidgen").onclick = generateVideo;
  t.onkeydown = function(e){ if(e.keyCode===13 && !e.shiftKey && window.innerWidth>700){ e.preventDefault(); send(); } };
  t.oninput = function(){ t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 130) + "px"; updSend(); };
  $("th").onclick = function(){ store("grok_think", thinkOn() ? "0" : "1"); $("th").className = thinkOn() ? "on" : ""; };
  $("th").className = thinkOn() ? "on" : "";
  $("mp").onclick = openCfg;
  $("cx").onclick = closeCfg;
  $("cs").onclick = function(){
    store("grok_key", $("k").value.replace(/\s/g,""));
    store("grok_model", $("md").value.replace(/\s/g,""));
    store("grok_sys", $("sp").value);
    closeCfg(); if(!history.length) drawAll();
  };
  $("bn").onclick = newChat;
  $("bh").onclick = openDrawer;
  $("dro").onclick = closeDrawer;
  $("dnew").onclick = function(){ newChat(); closeDrawer(); };
  $("dall").onclick = delAll;
  $("dset").onclick = openCfg;
  $("q").oninput = renderList;

  drawAll();
})();
</script>
